networks:
  dagster_network:
    name: dagster_network

volumes:
  dagster_pg_data:
  dagster_duckdb_data:

services:
  dagster_postgresql:
    image: postgres:15
    container_name: dagster_postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - dagster_network
    restart: unless-stopped
    volumes:
      - dagster_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  demo_pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demo_pipeline
    image: demo-pipeline:latest
    command: ["dagster", "api", "grpc", "-h", "0.0.0.0", "-p", "4000", "-m", "demo_pipeline"]
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE}
      OPENLINEAGE_URL: ${OPENLINEAGE_URL}
      OPENLINEAGE_API_KEY: ${OPENLINEAGE_API_KEY}
      OL_ENV_TAG: ${OL_ENV_TAG}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./dagster_home:/opt/dagster/dagster_home
      - dagster_duckdb_data:/opt/dagster/app/data
    networks:
      - dagster_network
    restart: unless-stopped
    expose:
      - "4000"

  dagster-webserver:
    image: demo-pipeline:latest
    container_name: dagster-webserver
    entrypoint: ["dagster-webserver"]
    command: ["-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster/dagster_home/workspace.yaml"]
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE}
      OPENLINEAGE_URL: ${OPENLINEAGE_URL}
      OPENLINEAGE_API_KEY: ${OPENLINEAGE_API_KEY}
      OL_ENV_TAG: ${OL_ENV_TAG}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "3000:3000"
    volumes:
      - ./dagster_home:/opt/dagster/dagster_home
      - ./workspace.yaml:/opt/dagster/dagster_home/workspace.yaml
      - dagster_duckdb_data:/opt/dagster/app/data
    networks:
      - dagster_network
    restart: unless-stopped
    depends_on:
      dagster_postgresql:
        condition: service_healthy
      demo_pipeline:
        condition: service_started

  dagster-daemon:
    image: demo-pipeline:latest
    container_name: dagster-daemon
    entrypoint: ["dagster-daemon"]
    command: ["run", "-w", "/opt/dagster/dagster_home/workspace.yaml"]
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE}
      OPENLINEAGE_URL: ${OPENLINEAGE_URL}
      OPENLINEAGE_API_KEY: ${OPENLINEAGE_API_KEY}
      OL_ENV_TAG: ${OL_ENV_TAG}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./dagster_home:/opt/dagster/dagster_home
      - ./workspace.yaml:/opt/dagster/dagster_home/workspace.yaml
      - dagster_duckdb_data:/opt/dagster/app/data
    networks:
      - dagster_network
    restart: unless-stopped
    depends_on:
      dagster_postgresql:
        condition: service_healthy
      demo_pipeline:
        condition: service_started
